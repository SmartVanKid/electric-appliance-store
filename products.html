<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>VOLTIX | คลังสินค้าทั้งหมด</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-bolt-lightning"></i> VOLTIX</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="products.html" class="active">สินค้าทั้งหมด</a>
            <a href="technology.html">แนะนำเทคโนโลยี</a>
        </nav>
        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge">0</span>
        </a>
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>
                <h1 style="color: var(--neon-cyan);">สินค้าทั้งหมด</h1>
                <p style="color: var(--text-muted);">เลือกคลิกตามหมวดหมู่เพื่อดูสินค้าที่คุณสนใจ</p>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาสินค้า..." onkeyup="filterSearch()" style="padding: 10px 18px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.3); background: rgba(15, 18, 28, 0.8); color: #fff; width: 280px;">
        </div>

        <!-- ตัวเลือกหมวดหมู่แบบปุ่มกด -->
        <div class="category-menu">
            <button class="cat-btn active" onclick="filterCategory('all', this)"><i class="fa-solid fa-border-all"></i> ทั้งหมด</button>
            <button class="cat-btn" onclick="filterCategory('tv', this)"><i class="fa-solid fa-tv"></i> ทีวีและสมาร์ทดิสเพลย์</button>
            <button class="cat-btn" onclick="filterCategory('mouse', this)"><i class="fa-solid fa-computer-mouse"></i> เมาส์และอุปกรณ์เกมมิ่ง</button>
            <button class="cat-btn" onclick="filterCategory('kitchen', this)"><i class="fa-solid fa-mug-hot"></i> เครื่องใช้ในครัว</button>
            <button class="cat-btn" onclick="filterCategory('air', this)"><i class="fa-solid fa-wind"></i> เครื่องฟอกอากาศ</button>
            <button class="cat-btn" onclick="filterCategory('smart', this)"><i class="fa-solid fa-house-signal"></i> สมาร์ตโฮม</button>
        </div>

        <!-- รายการสินค้า -->
        <div class="product-grid" id="productGrid"></div>
    </div>

    <footer>© 2026 VOLTIX ELECTRONICS. สงวนลิขสิทธิ์ทั้งหมด</footer>
    <script src="main.js"></script>
    <script>
        let currentCategory = 'all';

        function displayProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            
            if(items.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; padding: 40px 0; text-align: center;">ไม่พบสินค้าในหมวดหมู่นี้</p>`;
                return;
            }

            items.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}">
                        <h3 style="font-size: 17px; margin-bottom: 8px;">${p.name}</h3>
                        <p style="color: var(--neon-cyan); font-size: 20px; font-weight: bold; margin-bottom: 12px;">฿${p.price.toLocaleString()}</p>
                        <button class="btn btn-primary" onclick="addToCart(${p.id})" style="width: 100%;"><i class="fa-solid fa-cart-plus"></i> เพิ่มลงตะกร้า</button>
                    </div>
                `;
            });
        }

        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (cat === 'all') {
                displayProducts(productsData);
            } else {
                const filtered = productsData.filter(p => p.category === cat);
                displayProducts(filtered);
            }
        }

        function filterSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = productsData.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchQuery = p.name.toLowerCase().includes(query);
                return matchCategory && matchQuery;
            });
            displayProducts(filtered);
        }

        displayProducts(productsData);
    </script>
</body>
</html>
