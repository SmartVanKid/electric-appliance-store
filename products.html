<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>VOLTIX | สินค้าทั้งหมด</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-bolt-lightning"></i> VOLTIX</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="products.html" class="active">สินค้าทั้งหมด</a>
            <a href="technology.html">เทคโนโลยีใหม่</a>
        </nav>
        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge">0</span>
        </a>
    </header>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>
                <h1 style="font-family: 'Orbitron'; color: var(--neon-cyan);">ALL PRODUCTS</h1>
                <p style="color: var(--text-muted);">เลือกชมเครื่องใช้ไฟฟ้าและอุปกรณ์สมาร์ตโฮมสุดล้ำ</p>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 ค้นหาสินค้า (เช่น TV, Mouse)..." onkeyup="filterProducts()" style="padding: 12px 20px; border-radius: 12px; width: 300px;">
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <footer>© 2026 VOLTIX ELECTRONICS. ALL RIGHTS RESERVED.</footer>
    <script src="main.js"></script>
    <script>
        function displayProducts(items) {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            items.forEach(p => {
                grid.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}">
                        <h3>${p.name}</h3>
                        <p style="color: var(--neon-cyan); font-family: 'Orbitron'; font-size: 20px; font-weight: bold; margin: 10px 0;">฿${p.price.toLocaleString()}</p>
                        <button class="btn btn-primary" onclick="addToCart(${p.id})" style="width: 100%;"><i class="fa-solid fa-plus"></i> เพิ่มลงตะกร้า</button>
                    </div>
                `;
            });
        }

        function filterProducts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = productsData.filter(p => p.name.toLowerCase().includes(query) || p.category.includes(query));
            displayProducts(filtered);
        }

        displayProducts(productsData);
    </script>
</body>
</html>
