<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>VOLTIX | ตะกร้าสินค้า</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-bolt-lightning"></i> VOLTIX</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="products.html">สินค้าทั้งหมด</a>
            <a href="technology.html">เทคโนโลยีใหม่</a>
        </nav>
        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge">0</span>
        </a>
    </header>

    <div class="container" style="max-width: 800px;">
        <h1 style="font-family: 'Orbitron'; color: var(--neon-cyan); margin-bottom: 20px;"><i class="fa-solid fa-cart-shopping"></i> MY CART</h1>
        
        <div id="cartList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        
        <div style="margin-top: 30px; padding: 20px; background: var(--card-glass); border-radius: 16px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center;">
            <h2 id="totalPrice" style="font-family: 'Orbitron'; color: var(--text-main);">TOTAL: ฿0</h2>
            <button class="btn btn-primary" onclick="clearCart()"><i class="fa-solid fa-credit-card"></i> ชำระเงิน</button>
        </div>
    </div>

    <footer>© 2026 VOLTIX ELECTRONICS. ALL RIGHTS RESERVED.</footer>
    <script src="main.js"></script>
    <script>
        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 40px 0;">ไม่มีสินค้าในตะกร้าของคุณ</p>`;
                document.getElementById('totalPrice').innerText = 'TOTAL: ฿0';
                return;
            }

            cart.forEach((item) => {
                total += item.price;
                list.innerHTML += `
                    <div style="background: var(--card-glass); border: 1px solid var(--card-border); padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${item.img}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 8px;">
                            <h4>${item.name}</h4>
                        </div>
                        <span style="color: var(--neon-cyan); font-family: 'Orbitron'; font-weight: bold;">฿${item.price.toLocaleString()}</span>
                    </div>
                `;
            });
            document.getElementById('totalPrice').innerText = `TOTAL: ฿${total.toLocaleString()}`;
        }

        function clearCart() {
            if(cart.length === 0) return;
            alert('ขอบคุณสำหรับการสั่งซื้อสินค้า VOLTIX!');
            localStorage.removeItem('voltix_cart');
            cart = [];
            renderCart();
            updateCartCount();
        }

        renderCart();
    </script>
</body>
</html>
