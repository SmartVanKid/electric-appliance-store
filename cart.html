<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>VOLTIX | ตะกร้าสินค้าของคุณ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo"><i class="fa-solid fa-bolt-lightning"></i> VOLTIX</a>
        <nav>
            <a href="index.html">หน้าแรก</a>
            <a href="products.html">สินค้าทั้งหมด</a>
            <a href="technology.html">แนะนำเทคโนโลยี</a>
        </nav>
        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-bag-shopping"></i>
            <span class="cart-badge">0</span>
        </a>
    </header>

    <div class="container" style="max-width: 800px;">
        <h1 style="color: var(--neon-cyan); margin-bottom: 25px;"><i class="fa-solid fa-cart-shopping"></i> ตะกร้าสินค้าของคุณ</h1>
        
        <div id="cartList" style="display: flex; flex-direction: column; gap: 15px;"></div>
        
        <div style="margin-top: 30px; padding: 20px; background: var(--card-glass); border-radius: 16px; border: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center;">
            <h2 id="totalPrice" style="color: var(--text-main); font-size: 22px;">ราคารวมทั้งหมด: ฿0</h2>
            <button class="btn btn-primary" onclick="clearCart()"><i class="fa-solid fa-credit-card"></i> ดำเนินการชำระเงิน</button>
        </div>
    </div>

    <footer>© 2026 VOLTIX ELECTRONICS. สงวนลิขสิทธิ์ทั้งหมด</footer>
    <script src="main.js"></script>
    <script>
        function renderCart() {
            const list = document.getElementById('cartList');
            list.innerHTML = '';
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = `<p style="color: var(--text-muted); text-align: center; padding: 40px 0;">ไม่มีสินค้าอยู่ในตะกร้าของคุณขณะนี้</p>`;
                document.getElementById('totalPrice').innerText = 'ราคารวมทั้งหมด: ฿0';
                return;
            }

            cart.forEach((item) => {
                total += item.price;
                list.innerHTML += `
                    <div style="background: var(--card-glass); border: 1px solid var(--card-border); padding: 15px 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${item.img}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">
                            <h4>${item.name}</h4>
                        </div>
                        <span style="color: var(--neon-cyan); font-size: 18px; font-weight: bold;">฿${item.price.toLocaleString()}</span>
                    </div>
                `;
            });
            document.getElementById('totalPrice').innerText = `ราคารวมทั้งหมด: ฿${total.toLocaleString()}`;
        }

        function clearCart() {
            if(cart.length === 0) return;
            alert('ขอบคุณสำหรับการสั่งซื้อสินค้ากับ VOLTIX!');
            localStorage.removeItem('voltix_cart');
            cart = [];
            renderCart();
            updateCartCount();
        }

        renderCart();
    </script>
</body>
</html>
