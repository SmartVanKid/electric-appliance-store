    <!-- เมนูบาร์ด้านบน (Header) -->
    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-bolt"></i> Smart<span>Tech</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">หน้าแรก</a></li>
                <li><a href="ac.html">แอร์</a></li>

                <button class="btn-add" style="padding: 0.75rem 1.5rem;">ค้นหา</button>

        </div>

    <!-- สคริปต์เรียก Footer อัตโนมัติและระบบ -->

    <script src="footer.js"></script>
